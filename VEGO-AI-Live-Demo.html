function setPulse(x,y){pO.setAttribute('cx',x);pO.setAttribute('cy',y);pI.setAttribute('cx',x);pI.setAttribute('cy',y);}
function animate(eid,dur){const poly=EDGES[eid];const st=performance.now();pO.setAttribute('opacity','1');pI.setAttribute('opacity','1');
  function fr(now){let t=Math.min(1,(now-st)/dur);let pt=pointOn(poly,t);setPulse(pt[0],pt[1]);if(t<1){raf=requestAnimationFrame(fr);}}
  raf=requestAnimationFrame(fr);}
function show(n){reset();i=n;const b=BEATS[i];
  if(b.c){let bx=document.getElementById('box_'+b.c);if(bx){bx.setAttribute('stroke-width','3');bx.setAttribute('filter','url(#gl)');}}
  if(b.e){let el=document.getElementById('edge_'+b.e);if(el){el.setAttribute('opacity','1');el.setAttribute('stroke-width','3.4');el.setAttribute('filter','url(#gl)');}animate(b.e,1800);}
  cap.textContent=b.cap;cnt.textContent=(i+1)+' / '+BEATS.length;
  document.getElementById('prev').disabled=(i===0);document.getElementById('next').disabled=(i===BEATS.length-1);}
function next(){if(i<BEATS.length-1)show(i+1);else stopAuto();}
function prev(){if(i>0)show(i-1);}
function stopAuto(){if(timer){clearInterval(timer);timer=null;document.getElementById('auto').textContent='▶ Auto (slow)';}}
document.getElementById('next').onclick=()=>{stopAuto();next();};
document.getElementById('prev').onclick=()=>{stopAuto();prev();};
document.getElementById('restart').onclick=()=>{stopAuto();show(0);};
document.getElementById('auto').onclick=()=>{if(timer){stopAuto();}else{document.getElementById('auto').textContent='❚❚ Pause';timer=setInterval(next,4500);}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){stopAuto();next();}if(e.key==='ArrowLeft'){stopAuto();prev();}});
show(0);
</script></body></html>
