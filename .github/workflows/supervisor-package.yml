name: Supervisor and thesis research package checks

on:
  pull_request:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned research-package dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-thesis.txt

      - name: Compile source
        run: python -m compileall -q VEGO-AI/framework VEGO-AI/eval VEGO-AI/analysis scripts

      - name: Run clone-safe baseline and package tests
        run: >-
          python -m pytest
          VEGO-AI/tests
          scripts/tests/test_build_hlayer_decision_snapshot.py
          scripts/tests/test_build_hlayer_program_overview.py
          scripts/tests/test_build_progress_tracker.py
          scripts/tests/test_thesis_evidence_package.py
          --deselect=VEGO-AI/tests/test_visualizer_helpers.py::test_extract_case_id_examples
          -q

      - name: Validate research schemas, claims, citations, and freshness
        run: |
          python scripts/validate_research_records.py schemas/examples
          python scripts/check_thesis_citations.py
          python scripts/validate_thesis_content.py
          python scripts/validate_thesis_evidence_package.py
          python scripts/build_thesis_evidence_package.py --check
          python scripts/build_thesis_progress_visual.py --check
          python scripts/build_thesis_review_manifest.py --check
          python visualizations-gallery/build_gallery.py --check
          python scripts/visualization_agent.py --check
          python scripts/check_repository_privacy.py

      - name: Validate deterministic thesis DOCX
        run: |
          python scripts/validate_thesis_review_document.py \
            thesis/output/VEGO-AI-MSc-Thesis-Evidence-Ready-Draft-2026-07-24.docx
          python scripts/build_thesis_review_document.py --check
          mkdir -p "${RUNNER_TEMP}/thesis-a" "${RUNNER_TEMP}/thesis-b"
          python scripts/build_thesis_review_document.py \
            --output "${RUNNER_TEMP}/thesis-a/review.docx"
          python scripts/build_thesis_review_document.py \
            --output "${RUNNER_TEMP}/thesis-b/review.docx"
          test "$(sha256sum "${RUNNER_TEMP}/thesis-a/review.docx" | cut -d' ' -f1)" = \
               "$(sha256sum "${RUNNER_TEMP}/thesis-b/review.docx" | cut -d' ' -f1)"

      - name: Validate protected-path boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "${BASE_SHA}...HEAD" -- \
            VEGO-AI/framework \
            VEGO-AI/schemas \
            VEGO-AI/eval \
            VEGO-AI/eval_output \
            VEGO-AI/inputs \
            VEGO-AI/tests; then
            echo "This research-package PR modified a protected VEGO-AI path."
            git diff --name-status "${BASE_SHA}...HEAD" -- \
              VEGO-AI/framework \
              VEGO-AI/schemas \
              VEGO-AI/eval \
              VEGO-AI/eval_output \
              VEGO-AI/inputs \
              VEGO-AI/tests
            exit 1
          fi
          python scripts/validate_supervisor_package.py

      - name: Scan tracked package artifacts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED="$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD")"
          if printf '%s\n' "${CHANGED}" | grep -Eiq \
            '(^|/)(exp005.*(filled|labels)|.*reviewer.*sheet|.*split.*mapping|.*transcript|.*\.srt|.*\.mp4)$'; then
            echo "A private or forbidden research artifact is tracked."
            printf '%s\n' "${CHANGED}" | grep -Ei \
              '(^|/)(exp005.*(filled|labels)|.*reviewer.*sheet|.*split.*mapping|.*transcript|.*\.srt|.*\.mp4)$'
            exit 1
          fi
          if grep -ERnI \
            '([A-Za-z]:[\\/](Users|home)[\\/]|file:///|codex-file-citation|oai-mem-citation)' \
            docs/research/thesis-evidence \
            VEGO-AI-Thesis-Baseline-Progress.html; then
            echo "A tracked thesis package contains an internal or personal path."
            exit 1
          fi

      - name: Check diff and line-ending hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "${BASE_SHA}...HEAD"
          test -z "$(git ls-files --eol '*.html' | grep -v 'i/lf' || true)"

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Exercise supervisor and thesis packages at supported widths
        run: |
          node scripts/tests/supervisor_package_browser_smoke.mjs
          node scripts/tests/thesis_progress_browser_smoke.mjs
