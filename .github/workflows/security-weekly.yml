name: Weekly dependency and repository security audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.10.6"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frozen audit environment
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen --all-groups
          npm ci --ignore-scripts --no-audit

      - name: Run dependency and repository scans
        run: |
          uv run python scripts/security_audit.py --history
          uv run python scripts/check_quality_ratchet.py
          uv export --frozen --all-groups --no-hashes --quiet \
            --output-file "${RUNNER_TEMP}/requirements-audit.txt"
          uv run pip-audit -r "${RUNNER_TEMP}/requirements-audit.txt" \
            --progress-spinner off
          npm audit --audit-level=high
