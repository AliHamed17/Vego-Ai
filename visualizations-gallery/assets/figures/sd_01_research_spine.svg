<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .bg { fill: #F8FAFC; }
    .title { font: 700 48px Arial, sans-serif; fill: #0F172A; }
    .subtitle { font: 400 25px Arial, sans-serif; fill: #475569; }
    .nodeTitle { font: 700 25px Arial, sans-serif; fill: #0F172A; }
    .nodeBody { font: 400 21px Arial, sans-serif; fill: #334155; }
    .footer { font: 400 22px Arial, sans-serif; fill: #64748B; }
  </style>
  <rect class="bg" width="1600" height="900"/>
  <text x="80" y="88" class="title">Research Spine</text>
  <text x="80" y="132" class="subtitle">Reusable human judgment in AI-assisted model assessment</text>
  
      <g>
        <path d="M 302 420 L 367.5 420" stroke="#64748B" stroke-width="5" fill="none"/><path d="M 367.5 420 l -18 -12 v 24 z" fill="#64748B"/>
        <rect x="80" y="345" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#0B7285" stroke-width="4"/>
        <text x="102" y="393" class="nodeTitle">AI review</text>
        <text x="102" y="431" class="nodeBody">detects where</text>
        <text x="102" y="461" class="nodeBody">judgment is needed</text>
      </g>

      <g>
        <path d="M 609.5 420 L 675 420" stroke="#64748B" stroke-width="5" fill="none"/><path d="M 675 420 l -18 -12 v 24 z" fill="#64748B"/>
        <rect x="387.5" y="345" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#2F9E44" stroke-width="4"/>
        <text x="409.5" y="393" class="nodeTitle">Human feedback</text>
        <text x="409.5" y="431" class="nodeBody">captured as</text>
        <text x="409.5" y="461" class="nodeBody">structured evidence</text>
      </g>

      <g>
        <path d="M 917 420 L 982.5 420" stroke="#64748B" stroke-width="5" fill="none"/><path d="M 982.5 420 l -18 -12 v 24 z" fill="#64748B"/>
        <rect x="695" y="345" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#5F3DC4" stroke-width="4"/>
        <text x="717" y="393" class="nodeTitle">Memory</text>
        <text x="717" y="431" class="nodeBody">stored as</text>
        <text x="717" y="461" class="nodeBody">reusable knowledge</text>
      </g>

      <g>
        <path d="M 1224.5 420 L 1290 420" stroke="#64748B" stroke-width="5" fill="none"/><path d="M 1290 420 l -18 -12 v 24 z" fill="#64748B"/>
        <rect x="1002.5" y="345" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#C2410C" stroke-width="4"/>
        <text x="1024.5" y="393" class="nodeTitle">Advice</text>
        <text x="1024.5" y="431" class="nodeBody">retrieved as</text>
        <text x="1024.5" y="461" class="nodeBody">context</text>
      </g>

      <g>
        
        <rect x="1310" y="345" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
        <text x="1332" y="393" class="nodeTitle">Comparison</text>
        <text x="1332" y="431" class="nodeBody">parallel and</text>
        <text x="1332" y="461" class="nodeBody">non-destructive</text>
      </g>
  <text x="80" y="842" class="footer">Claim: human judgment can be selectively triggered, structurally captured, and reused as advisory evidence.</text>
</svg>
